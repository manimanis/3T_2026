<svg viewBox="0 0 800 250" width="100%" height="230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-steg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="grad-proc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <marker id="arrow-amber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#f59e0b" />
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#6366f1" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="10" y="10" width="780" height="230" rx="12" fill="#1e293b" fill-opacity="0.05" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Step 1: Input Box -->
  <g transform="translate(30, 35)">
    <rect x="0" y="0" width="210" height="180" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="10" y="10" width="190" height="28" rx="6" fill="url(#grad-steg)"/>
    <text x="105" y="29" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1. SAISIE &amp; CONTRÔLE</text>

    <rect x="15" y="50" width="180" height="50" rx="6" fill="#0f172a" stroke="#f59e0b"/>
    <text x="105" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">saisir_taille(7, 30)</text>
    <text x="105" y="88" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Boucle Répéter / while</text>

    <rect x="15" y="112" width="180" height="55" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="105" y="132" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">saisir_consommations</text>
    <text x="105" y="152" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Val. réelles ∈ [0.5, 50.0]</text>
  </g>

  <path d="M 245 125 L 275 125" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-amber)"/>

  <!-- Step 2: Storage Box -->
  <g transform="translate(280, 35)">
    <rect x="0" y="0" width="220" height="180" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="10" y="10" width="200" height="28" rx="6" fill="url(#grad-proc)"/>
    <text x="110" y="29" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2. STOCKAGE &amp; IMPLÉM.</text>

    <rect x="15" y="50" width="190" height="117" rx="6" fill="#0f172a" stroke="#6366f1"/>
    <text x="105" y="75" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#a5b4fc" text-anchor="middle">Conso = array(...)</text>
    <text x="105" y="100" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Tableau 1D numpy (n Réels)</text>
    <text x="105" y="125" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#10b981" text-anchor="middle">✓ Affichage par élément</text>
    <text x="105" y="145" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ef4444" text-anchor="middle">✗ Pas d'instruction break</text>
  </g>

  <path d="M 505 125 L 535 125" stroke="#6366f1" stroke-width="2.5" marker-end="url(#arrow-indigo)"/>

  <!-- Step 3: Analysis & Report Box -->
  <g transform="translate(540, 35)">
    <rect x="0" y="0" width="230" height="180" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.5"/>
    <rect x="10" y="10" width="210" height="28" rx="6" fill="#10b981"/>
    <text x="115" y="29" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3. BILAN ÉNERGÉTIQUE</text>

    <rect x="15" y="50" width="200" height="35" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="115" y="72" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">calculer_moyenne(Conso, n)</text>

    <rect x="15" y="90" width="200" height="35" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="115" y="112" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">rechercher_pic(Conso, n) [Max]</text>

    <rect x="15" y="130" width="200" height="37" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="115" y="152" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">compter_surconsommations</text>
  </g>
</svg>
