<svg viewBox="0 0 800 250" width="100%" height="230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-seq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-found" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="10" y="10" width="780" height="230" rx="12" fill="#1e293b" fill-opacity="0.05" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Block 1: Sequential Scanning -->
  <g transform="translate(30, 25)">
    <rect x="0" y="0" width="350" height="200" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="10" y="10" width="330" height="28" rx="6" fill="url(#grad-seq)"/>
    <text x="175" y="29" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">1. PARCOURS SÉQUENTIEL (i = 0 ... n-1)</text>

    <!-- Array cells -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="55" height="40" rx="4" fill="#0f172a" stroke="#64748b"/>
      <text x="27" y="25" font-family="'Fira Code', monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">101</text>
      <text x="27" y="55" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">[0]</text>

      <rect x="65" y="0" width="55" height="40" rx="4" fill="#0f172a" stroke="#64748b"/>
      <text x="92" y="25" font-family="'Fira Code', monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">104</text>
      <text x="92" y="55" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">[1]</text>

      <!-- Target Cell -->
      <rect x="130" y="0" width="55" height="40" rx="4" fill="#065f46" stroke="#10b981" stroke-width="2"/>
      <text x="157" y="25" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">109</text>
      <text x="157" y="55" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">[2] ✓</text>

      <rect x="195" y="0" width="55" height="40" rx="4" fill="#0f172a" stroke="#334155"/>
      <text x="222" y="25" font-family="'Fira Code', monospace" font-size="12" fill="#64748b" text-anchor="middle">112</text>
      <text x="222" y="55" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">[3]</text>

      <rect x="260" y="0" width="50" height="40" rx="4" fill="#0f172a" stroke="#334155"/>
      <text x="285" y="25" font-family="'Fira Code', monospace" font-size="12" fill="#64748b" text-anchor="middle">...</text>
    </g>

    <!-- Condition box -->
    <rect x="20" y="125" width="310" height="60" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="175" y="145" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#60a5fa" text-anchor="middle">while i &lt; n and not trouve:</text>
    <text x="175" y="165" font-family="system-ui, sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">Sortie anticipée sans l'instruction break</text>
  </g>

  <!-- Block 2: Synchronized Parallel Arrays -->
  <g transform="translate(420, 25)">
    <rect x="0" y="0" width="350" height="200" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.5"/>
    <rect x="10" y="10" width="330" height="28" rx="6" fill="url(#grad-found)"/>
    <text x="175" y="29" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">2. TABLEAUX PARALLÈLES (IDs / Moyennes)</text>

    <!-- Table preview -->
    <rect x="20" y="50" width="310" height="135" rx="6" fill="#0f172a" stroke="#10b981"/>
    
    <text x="40" y="75" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0">Recherche ID = 109 :</text>
    
    <text x="40" y="105" font-family="'Fira Code', monospace" font-size="11" fill="#cbd5e1">1. pos = recherche_sequentielle(IDs, n, 109)</text>
    <text x="40" y="125" font-family="'Fira Code', monospace" font-size="11" fill="#34d399">2. Indice trouvé : pos = 2</text>
    <text x="40" y="150" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#a7f3d0">3. Moyennes[2] = 16.5 / 20</text>
  </g>
</svg>
