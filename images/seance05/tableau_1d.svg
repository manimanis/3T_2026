<svg viewBox="0 0 800 240" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-cell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="grad-active-cell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background Outer Card -->
  <rect x="10" y="10" width="780" height="220" rx="12" fill="#1e293b" fill-opacity="0.05" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Title Badge -->
  <rect x="230" y="20" width="340" height="34" rx="8" fill="url(#grad-blue)"/>
  <text x="400" y="42" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Structure d'un Tableau 1D en Mémoire (N éléments)</text>

  <!-- Array Container Box -->
  <g transform="translate(45, 80)">
    <!-- Indices Labels Top -->
    <text x="50" y="-12" font-family="'Fira Code', monospace" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">Indice 0</text>
    <text x="170" y="-12" font-family="'Fira Code', monospace" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">Indice 1</text>
    <text x="290" y="-12" font-family="'Fira Code', monospace" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">Indice 2</text>
    <text x="410" y="-12" font-family="'Fira Code', monospace" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">...</text>
    <text x="530" y="-12" font-family="'Fira Code', monospace" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">Indice i</text>
    <text x="650" y="-12" font-family="'Fira Code', monospace" font-size="13" font-weight="700" fill="#10b981" text-anchor="middle">Indice N - 1</text>

    <!-- Cells -->
    <!-- Cell 0 (First) -->
    <rect x="0" y="0" width="100" height="60" rx="8" fill="url(#grad-active-cell)" stroke="#60a5fa" stroke-width="2"/>
    <text x="50" y="35" font-family="'Fira Code', monospace" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Temp[0]</text>
    <text x="50" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#bfdbfe" text-anchor="middle">24.5 °C</text>

    <!-- Cell 1 -->
    <rect x="120" y="0" width="100" height="60" rx="8" fill="url(#grad-cell)" stroke="#334155" stroke-width="2"/>
    <text x="170" y="35" font-family="'Fira Code', monospace" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Temp[1]</text>
    <text x="170" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">26.0 °C</text>

    <!-- Cell 2 -->
    <rect x="240" y="0" width="100" height="60" rx="8" fill="url(#grad-cell)" stroke="#334155" stroke-width="2"/>
    <text x="290" y="35" font-family="'Fira Code', monospace" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Temp[2]</text>
    <text x="290" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">22.8 °C</text>

    <!-- Ellipsis Box -->
    <rect x="360" y="0" width="100" height="60" rx="8" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text x="410" y="36" font-family="'Fira Code', monospace" font-size="20" font-weight="700" fill="#64748b" text-anchor="middle">• • •</text>

    <!-- Cell i -->
    <rect x="480" y="0" width="100" height="60" rx="8" fill="url(#grad-cell)" stroke="#334155" stroke-width="2"/>
    <text x="530" y="35" font-family="'Fira Code', monospace" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">Temp[i]</text>
    <text x="530" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">19.5 °C</text>

    <!-- Cell N-1 (Last) -->
    <rect x="600" y="0" width="100" height="60" rx="8" fill="#047857" stroke="#10b981" stroke-width="2"/>
    <text x="650" y="35" font-family="'Fira Code', monospace" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Temp[N-1]</text>
    <text x="650" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">28.1 °C</text>

    <!-- Pointer Labels Bottom -->
    <line x1="50" y1="82" x2="50" y2="65" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="50" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">Premier Élément</text>

    <line x1="650" y1="82" x2="650" y2="65" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="650" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">Dernier Élément</text>
  </g>
</svg>
