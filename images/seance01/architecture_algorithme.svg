<svg viewBox="0 0 750 150" width="100%" height="150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2" />
    </marker>
  </defs>

  <!-- Input Box -->
  <g transform="translate(20, 25)">
    <rect width="190" height="90" rx="12" fill="#0891b2" stroke="#0e7490" stroke-width="2"/>
    <text x="95" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">1. ENTRÉES</text>
    <text x="95" y="66" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#cff4fc" text-anchor="middle">Lire() / input()</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="210" y1="70" x2="260" y2="70" stroke="#0891b2" stroke-width="3.5" marker-end="url(#arrow-cyan)"/>

  <!-- Processing Box -->
  <g transform="translate(270, 25)">
    <rect width="210" height="90" rx="12" fill="#059669" stroke="#047857" stroke-width="2"/>
    <text x="105" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">2. TRAITEMENT</text>
    <text x="105" y="66" font-family="'Courier New', monospace" font-size="13" font-weight="700" fill="#d1fae5" text-anchor="middle">Affectation (←) &amp; Calculs</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="480" y1="70" x2="530" y2="70" stroke="#0891b2" stroke-width="3.5" marker-end="url(#arrow-cyan)"/>

  <!-- Output Box -->
  <g transform="translate(540, 25)">
    <rect width="190" height="90" rx="12" fill="#d97706" stroke="#b45309" stroke-width="2"/>
    <text x="95" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">3. SORTIES</text>
    <text x="95" y="66" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#fef3c7" text-anchor="middle">Écrire() / print()</text>
  </g>
</svg>
