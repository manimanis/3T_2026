<svg viewBox="0 0 600 240" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Condition Diamond -->
  <polygon points="300,25 395,75 300,125 205,75" fill="#2563eb" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="300" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Condition ?</text>

  <!-- Vrai Path Left -->
  <text x="170" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#059669" text-anchor="middle">VRAI</text>
  <line x1="205" y1="75" x2="130" y2="75" stroke="#059669" stroke-width="2.5"/>
  <line x1="130" y1="75" x2="130" y2="129" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  
  <rect x="50" y="135" width="160" height="50" rx="10" fill="#059669" stroke="#047857" stroke-width="2.5"/>
  <text x="130" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Traitement 1</text>

  <!-- Faux Path Right -->
  <text x="430" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#dc2626" text-anchor="middle">FAUX</text>
  <line x1="395" y1="75" x2="470" y2="75" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="470" y1="75" x2="470" y2="129" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <rect x="390" y="135" width="160" height="50" rx="10" fill="#dc2626" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="470" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Traitement 2</text>

  <!-- Merge lines -->
  <line x1="130" y1="185" x2="130" y2="215" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="470" y1="185" x2="470" y2="215" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="130" y1="215" x2="470" y2="215" stroke="#2563eb" stroke-width="2.5"/>
</svg>
