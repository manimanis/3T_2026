<svg viewBox="0 0 540 240" width="100%" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Condition Diamond -->
  <polygon points="270,25 350,75 270,125 190,75" fill="#2563eb" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="270" y="80" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Condition ?</text>

  <!-- Vrai Path Left -->
  <text x="145" y="62" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#059669" text-anchor="middle">VRAI</text>
  <line x1="190" y1="75" x2="100" y2="75" stroke="#059669" stroke-width="2.5"/>
  <line x1="100" y1="75" x2="100" y2="129" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  
  <rect x="30" y="135" width="140" height="50" rx="10" fill="#059669" stroke="#047857" stroke-width="2.5"/>
  <text x="100" y="165" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Traitement 1</text>

  <!-- Faux Path Right -->
  <text x="395" y="62" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#dc2626" text-anchor="middle">FAUX</text>
  <line x1="350" y1="75" x2="440" y2="75" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="440" y1="75" x2="440" y2="129" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <rect x="370" y="135" width="140" height="50" rx="10" fill="#dc2626" stroke="#b91c1c" stroke-width="2.5"/>
  <text x="440" y="165" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Traitement 2</text>

  <!-- Merge lines -->
  <line x1="100" y1="185" x2="100" y2="215" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="440" y1="185" x2="440" y2="215" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="100" y1="215" x2="440" y2="215" stroke="#2563eb" stroke-width="2.5"/>
</svg>
