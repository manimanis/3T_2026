<svg viewBox="0 0 550 240" width="100%" height="210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Entry Arrow into Condition -->
  <line x1="130" y1="10" x2="130" y2="30" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- Condition Diamond -->
  <polygon points="130,30 215,80 130,130 45,80" fill="#2563eb" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="130" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Condition ?</text>

  <!-- VRAI Branch (Right to Traitement) -->
  <text x="250" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#059669">VRAI</text>
  <line x1="215" y1="80" x2="310" y2="80" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- Traitement Box -->
  <rect x="310" y="55" width="180" height="50" rx="10" fill="#059669" stroke="#047857" stroke-width="2.5"/>
  <text x="400" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Traitement</text>

  <!-- Exit from Traitement -->
  <line x1="400" y1="105" x2="400" y2="185" stroke="#059669" stroke-width="2.5"/>
  <line x1="400" y1="185" x2="136" y2="185" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- FAUX Branch (Down) -->
  <text x="145" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#dc2626">FAUX</text>
  <line x1="130" y1="130" x2="130" y2="225" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5" marker-end="url(#arrow-red)"/>
</svg>
