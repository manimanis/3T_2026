<svg viewBox="0 0 540 240" width="100%" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Proportionate Arrow Markers -->
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Entry Arrow from top into Condition (Col 1) -->
  <line x1="130" y1="10" x2="130" y2="35" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- Col 1: Condition Diamond -->
  <polygon points="130,35 200,80 130,125 60,80" fill="#2563eb" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="130" y="85" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Condition ?</text>

  <!-- VRAI Branch (Right arrow to Col 2) -->
  <text x="245" y="68" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#059669">VRAI</text>
  <line x1="200" y1="80" x2="310" y2="80" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- Col 2: Traitement Box -->
  <rect x="310" y="55" width="160" height="50" rx="10" fill="#059669" stroke="#047857" stroke-width="2.5"/>
  <text x="390" y="85" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Traitement</text>

  <!-- Exit from Traitement (Down then Left to Col 1) -->
  <line x1="390" y1="105" x2="390" y2="185" stroke="#059669" stroke-width="2.5"/>
  <line x1="390" y1="185" x2="136" y2="185" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- FAUX Branch (Straight Down in Col 1) -->
  <text x="145" y="148" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#dc2626">FAUX</text>
  <line x1="130" y1="125" x2="130" y2="225" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5" marker-end="url(#arrow-red)"/>
</svg>
