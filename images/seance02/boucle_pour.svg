<svg viewBox="0 0 740 230" width="100%" height="230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Étape 1: Initialisation (Orange) -->
  <rect x="20" y="70" width="175" height="60" rx="10" fill="#d97706" stroke="#b45309" stroke-width="2.5"/>
  <text x="107.5" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">compteur ← début</text>
  <text x="107.5" y="114" font-family="'Fira Code', 'Courier New', monospace" font-size="11" font-weight="600" fill="#fef3c7" text-anchor="middle">(range(a, b))</text>

  <!-- Flèche 1: Initialisation -> Condition -->
  <line x1="195" y1="100" x2="245" y2="100" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>

  <!-- Étape 2: Losange de Condition (Bleu) -->
  <polygon points="340,35 435,100 340,165 245,100" fill="#2563eb" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="340" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">compteur ≤ fin ?</text>
  <text x="340" y="114" font-family="'Fira Code', 'Courier New', monospace" font-size="11" font-weight="600" fill="#dbeafe" text-anchor="middle">(compteur &lt; b)</text>

  <!-- Branche VRAI -> Traitement -->
  <text x="455" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#059669">VRAI</text>
  <line x1="435" y1="100" x2="510" y2="100" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- Étape 3: Bloc Traitement & Incrémentation (Vert) -->
  <rect x="515" y="70" width="205" height="60" rx="10" fill="#059669" stroke="#047857" stroke-width="2.5"/>
  <text x="617.5" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Traitement</text>
  <text x="617.5" y="114" font-family="'Fira Code', 'Courier New', monospace" font-size="11" font-weight="600" fill="#d1fae5" text-anchor="middle">compteur ← compteur + pas</text>

  <!-- Flèche de retour en boucle -->
  <path d="M 617.5 70 L 617.5 20 L 340 20 L 340 35" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="5" marker-end="url(#arrow-green)"/>

  <!-- Branche FAUX -> Sortie -->
  <text x="355" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#dc2626">FAUX (Fin de boucle)</text>
  <line x1="340" y1="165" x2="340" y2="205" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
</svg>
