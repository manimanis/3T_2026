<svg viewBox="0 0 650 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706" />
    </marker>
  </defs>

  <!-- Step 1: Initialisation -->
  <rect x="20" y="70" width="140" height="60" rx="10" fill="#d97706" stroke="#b45309" stroke-width="2.5"/>
  <text x="90" y="96" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">compteur ← début</text>
  <text x="90" y="116" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#fef3c7" text-anchor="middle">(range(a, b))</text>

  <line x1="160" y1="100" x2="220" y2="100" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-yellow)"/>

  <!-- Step 2: Test Condition -->
  <polygon points="310,40 380,100 310,160 240,100" fill="#2563eb" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="310" y="94" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">compteur ≤ fin ?</text>
  <text x="310" y="114" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#dbeafe" text-anchor="middle">(compteur &lt; b)</text>

  <!-- Vrai Path -> Traitement & Increment -->
  <text x="410" y="85" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#059669">VRAI (Continuer)</text>
  <line x1="380" y1="100" x2="460" y2="100" stroke="#059669" stroke-width="3" marker-end="url(#arrow-yellow)"/>

  <rect x="470" y="70" width="160" height="60" rx="10" fill="#059669" stroke="#047857" stroke-width="2.5"/>
  <text x="550" y="95" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Traitement</text>
  <text x="550" y="115" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#d1fae5" text-anchor="middle">compteur ← compteur + pas</text>

  <!-- Loop Back Arrow -->
  <path d="M 550 70 L 550 25 L 310 25 L 310 40" fill="none" stroke="#059669" stroke-width="3" stroke-dasharray="5" marker-end="url(#arrow-yellow)"/>

  <!-- Faux Path -> Sortie -->
  <text x="325" y="185" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#dc2626">FAUX (Fin de boucle)</text>
  <line x1="310" y1="160" x2="310" y2="200" stroke="#dc2626" stroke-width="3"/>
</svg>
