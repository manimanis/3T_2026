<svg viewBox="0 0 800 250" width="100%" height="230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-global" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-local" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="grad-ref" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background Container -->
  <rect x="10" y="10" width="780" height="230" rx="12" fill="#1e293b" fill-opacity="0.05" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Left Box: Passage par Valeur -->
  <g transform="translate(30, 25)">
    <rect x="0" y="0" width="350" height="200" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="10" y="10" width="330" height="28" rx="6" fill="url(#grad-global)"/>
    <text x="175" y="29" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">PASSAGE PAR VALEUR (Types simples)</text>

    <!-- Global Box -->
    <rect x="20" y="50" width="140" height="60" rx="6" fill="#0f172a" stroke="#3b82f6"/>
    <text x="90" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#93c5fd" text-anchor="middle">Prog. Principal</text>
    <text x="90" y="90" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">x = 5</text>

    <!-- Arrow Copy -->
    <path d="M 165 80 L 195 80" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="180" y="73" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">copie</text>

    <!-- Local Box -->
    <rect x="200" y="50" width="130" height="60" rx="6" fill="#0f172a" stroke="#8b5cf6"/>
    <text x="265" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c4b5fd" text-anchor="middle">Module Local</text>
    <text x="265" y="90" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="middle">x_loc = 15</text>

    <!-- Status Result -->
    <rect x="20" y="125" width="310" height="60" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="175" y="145" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">Modifications locales isolées</text>
    <text x="175" y="165" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Prog. Principal conserve x = 5 (immuable)</text>
  </g>

  <!-- Right Box: Passage par Référence -->
  <g transform="translate(420, 25)">
    <rect x="0" y="0" width="350" height="200" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.5"/>
    <rect x="10" y="10" width="330" height="28" rx="6" fill="url(#grad-ref)"/>
    <text x="175" y="29" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">PASSAGE PAR ADRESSE (@ / numpy / dict)</text>

    <!-- Global Box -->
    <rect x="20" y="50" width="140" height="60" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="90" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">Variable Origine</text>
    <text x="90" y="90" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">T = [12, 15, ...]</text>

    <!-- Pointer Arrow -->
    <path d="M 165 80 L 195 80" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <text x="180" y="73" font-family="system-ui, sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">adresse</text>

    <!-- Module Box -->
    <rect x="200" y="50" width="130" height="60" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="265" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">Module (@T)</text>
    <text x="265" y="90" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">T[0] = 20</text>

    <!-- Status Result -->
    <rect x="20" y="125" width="310" height="60" rx="6" fill="#064e3b" stroke="#10b981"/>
    <text x="175" y="145" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">Modifications directes en mémoire !</text>
    <text x="175" y="165" font-family="system-ui, sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">La variable d'origine du Prog. Principal est modifiée</text>
  </g>
</svg>
