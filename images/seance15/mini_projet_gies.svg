<svg viewBox="0 0 800 250" width="100%" height="230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="grad-mod" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#6366f1" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="10" y="10" width="780" height="230" rx="12" fill="#1e293b" fill-opacity="0.05" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Center Menu Box -->
  <g transform="translate(30, 25)">
    <rect x="0" y="0" width="220" height="200" rx="10" fill="#1e293b" fill-opacity="0.7" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="10" y="10" width="200" height="28" rx="6" fill="url(#grad-main)"/>
    <text x="110" y="29" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">MENU PRINCIPAL (GIES)</text>

    <rect x="15" y="48" width="190" height="138" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="68" font-family="'Fira Code', monospace" font-size="10" fill="#a5b4fc">1. Saisir la classe</text>
    <text x="25" y="88" font-family="'Fira Code', monospace" font-size="10" fill="#a5b4fc">2. Afficher le relevé</text>
    <text x="25" y="108" font-family="'Fira Code', monospace" font-size="10" fill="#a5b4fc">3. Trier (Tri à bulles)</text>
    <text x="25" y="128" font-family="'Fira Code', monospace" font-size="10" fill="#a5b4fc">4. Rechercher (Séquentiel)</text>
    <text x="25" y="148" font-family="'Fira Code', monospace" font-size="10" fill="#a5b4fc">5. Statistiques</text>
    <text x="25" y="168" font-family="'Fira Code', monospace" font-size="10" fill="#ef4444">6. Quitter</text>
  </g>

  <!-- Modules Grid -->
  <g transform="translate(280, 25)">
    <rect x="0" y="0" width="490" height="200" rx="10" fill="#1e293b" fill-opacity="0.7" stroke="#10b981" stroke-width="1.5"/>
    <rect x="10" y="10" width="470" height="28" rx="6" fill="url(#grad-mod)"/>
    <text x="245" y="29" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">5 MODULES PYTHON SPÉCIALISÉS</text>

    <!-- Module 1 -->
    <rect x="20" y="50" width="215" height="40" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="127" y="68" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">saisir_donnees()</text>
    <text x="127" y="82" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Unicité ID &amp; Notes [0..20]</text>

    <!-- Module 2 -->
    <rect x="255" y="50" width="215" height="40" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="362" y="68" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">afficher_releve()</text>
    <text x="362" y="82" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Parcours &amp; Affichage synchrone</text>

    <!-- Module 3 -->
    <rect x="20" y="100" width="215" height="40" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="127" y="118" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">trier_classe()</text>
    <text x="127" y="132" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Tri à bulles décroissant synchrone</text>

    <!-- Module 4 -->
    <rect x="255" y="100" width="215" height="40" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="362" y="118" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">recherche_seq()</text>
    <text x="362" y="132" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Recherche par ID (Zéro break)</text>

    <!-- Module 5 -->
    <rect x="20" y="150" width="450" height="35" rx="6" fill="#0f172a" stroke="#6366f1"/>
    <text x="245" y="172" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle">afficher_statistiques()  ➜  Moyenne, Min, Max, Taux de réussite</text>
  </g>
</svg>
