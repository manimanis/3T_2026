<svg viewBox="0 0 920 340" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Dégradés de fond et d'accents -->
    <linearGradient id="grad-bg7-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="grad-card7-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Marqueurs de flèche -->
    <marker id="arr-cyan7" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-green7" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10b981" />
    </marker>
    <marker id="arr-amber7" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Fond Principal -->
  <rect width="920" height="340" rx="14" fill="url(#grad-bg7-1)" stroke="#334155" stroke-width="2"/>

  <!-- En-tête -->
  <rect x="16" y="12" width="888" height="40" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="32" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">
    TRANSMISSION SÉRIE RS-485 ET BIT DE PARITÉ IMPAIRE
  </text>
  <rect x="690" y="18" width="202" height="28" rx="6" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1"/>
  <text x="791" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">
    Activité 1 &amp; 2 · Palier Socle (8 pts)
  </text>

  <!-- =========================================================================
       PANNEAU GAUCHE : VALIDATION DE LA TRAME 8 BITS (Activité 1)
       ========================================================================= -->
  <g id="validation-trame">
    <rect x="16" y="60" width="434" height="266" rx="10" fill="url(#grad-card7-1)" stroke="#475569" stroke-width="1.2"/>
    
    <rect x="26" y="70" width="414" height="24" rx="5" fill="#334155"/>
    <text x="233" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">
      1. Contrôle Algorithmique de Saisie (Boucle Répéter...Jusqu'à)
    </text>

    <!-- Instruction algorithmique de lecture -->
    <rect x="28" y="104" width="130" height="44" rx="6" fill="#0b1120" stroke="#64748b" stroke-width="1.2"/>
    <text x="93" y="121" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Lecture algorithmique</text>
    <text x="93" y="138" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">Lire(trame)</text>

    <!-- Flèche vers vérification -->
    <line x1="158" y1="126" x2="185" y2="126" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-cyan7)"/>

    <!-- Bloc Condition Algorithmique -->
    <rect x="188" y="104" width="248" height="66" rx="6" fill="#0b1120" stroke="#0284c7" stroke-width="1.5"/>
    <text x="312" y="122" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">
      Long(trame) = 8
    </text>
    <text x="312" y="139" font-family="'Fira Code', monospace" font-size="10" font-weight="700" fill="#a7f3d0" text-anchor="middle">
      ET pour tout i : trame[i] ∈ {"0", "1"}
    </text>
    <text x="312" y="157" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">
      Répéter ... Jusqu'à (trame_valide)
    </text>

    <!-- Cas Invalide (Rejet) -->
    <rect x="28" y="180" width="195" height="64" rx="6" fill="#7f1d1d" fill-opacity="0.3" stroke="#ef4444" stroke-width="1"/>
    <text x="38" y="198" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f87171">Cas Non Conformes (Rejet) :</text>
    <text x="38" y="215" font-family="'Fira Code', monospace" font-size="10" fill="#fca5a5">• "101" (Long = 3 ≠ 8)</text>
    <text x="38" y="231" font-family="'Fira Code', monospace" font-size="10" fill="#fca5a5">• "11020010" ('2' ∉ {"0","1"})</text>

    <!-- Cas Valide (Accepté) -->
    <rect x="233" y="180" width="203" height="64" rx="6" fill="#064e3b" fill-opacity="0.35" stroke="#10b981" stroke-width="1"/>
    <text x="243" y="198" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399">Cas Conforme (Accepté) :</text>
    <text x="243" y="215" font-family="'Fira Code', monospace" font-size="10" font-weight="700" fill="#6ee7b7">• trame = "11010010"</text>
    <text x="243" y="231" font-family="system-ui, sans-serif" font-size="9" fill="#a7f3d0">Long = 8 et binaire → Étape 2</text>

    <!-- Note algorithmique bas gauche -->
    <rect x="28" y="254" width="408" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="232" y="274" font-family="system-ui, sans-serif" font-size="9.5" fill="#e2e8f0" text-anchor="middle">
      <tspan font-weight="700" fill="#38bdf8">Structure de contrôle algorithmique :</tspan>
    </text>
    <text x="232" y="295" font-family="'Fira Code', monospace" font-size="10" fill="#facc15" text-anchor="middle">
      Répéter Saisir(trame) Jusqu'à (valide = Vrai)
    </text>
  </g>

  <!-- =========================================================================
       PANNEAU DROIT : PARITÉ IMPAIRE & ÉMISSION (Activité 2)
       ========================================================================= -->
  <g id="parite-impaire">
    <rect x="468" y="60" width="436" height="266" rx="10" fill="url(#grad-card7-1)" stroke="#475569" stroke-width="1.2"/>
    
    <rect x="478" y="70" width="416" height="24" rx="5" fill="#334155"/>
    <text x="686" y="86" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">
      2. Algorithme de Parité Impaire : Total final de "1" = IMPAIR
    </text>

    <!-- Décomposition comptage -->
    <rect x="480" y="104" width="412" height="68" rx="6" fill="#0b1120" stroke="#334155" stroke-width="1"/>
    <text x="492" y="123" font-family="'Fira Code', monospace" font-size="10" font-weight="700" fill="#38bdf8">trame = " 1  1  0  1  0  0  1  0 "</text>
    <text x="492" y="141" font-family="system-ui, sans-serif" font-size="10" fill="#e2e8f0">Nombre de "1" comptés : <tspan font-weight="700" fill="#f59e0b">nb_uns = 4</tspan> (PAIR car 4 mod 2 = 0)</text>
    <text x="492" y="159" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Pour obtenir un total impair, le bit de parité à concaténer est : <tspan font-weight="700" fill="#10b981">"1"</tspan></text>

    <!-- Règle schématisée algorithmique -->
    <rect x="480" y="180" width="198" height="64" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="490" y="198" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fbbf24">Si (nb_uns mod 2 = 0) Alors</text>
    <text x="490" y="216" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#34d399">bit_parite ← "1"</text>
    <text x="490" y="232" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Total : 4 + 1 = 5 (impair)</text>

    <rect x="694" y="180" width="198" height="64" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="704" y="198" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Sinon</text>
    <text x="704" y="216" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#34d399">bit_parite ← "0"</text>
    <text x="704" y="232" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">FinSi (Total reste impair)</text>

    <!-- Trame finale émise -->
    <rect x="480" y="254" width="412" height="60" rx="6" fill="#042f2e" stroke="#10b981" stroke-width="1.5"/>
    <text x="686" y="273" font-family="system-ui, sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">CONCATÉNATION ALGORITHMIQUE DU 9e BIT :</text>
    <text x="686" y="297" font-family="'Fira Code', monospace" font-size="13" font-weight="700" text-anchor="middle">
      <tspan fill="#38bdf8">trame_9bits</tspan> <tspan fill="#ffffff">←</tspan> <tspan fill="#38bdf8">trame</tspan> + <tspan fill="#4ade80">bit_parite</tspan> <tspan fill="#94a3b8">(= </tspan><tspan fill="#facc15">"110100101"</tspan><tspan fill="#94a3b8">)</tspan>
    </text>
  </g>
</svg>
