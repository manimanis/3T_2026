<svg viewBox="0 0 800 260" width="100%" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="grad-func" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="grad-proc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#6366f1" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10b981" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Background Outer Card -->
  <rect x="10" y="10" width="780" height="240" rx="12" fill="#1e293b" fill-opacity="0.05" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Top Level: Programme Principal -->
  <g transform="translate(250, 20)">
    <rect x="0" y="0" width="300" height="50" rx="8" fill="url(#grad-main)"/>
    <text x="150" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">PROGRAMME PRINCIPAL</text>
    <text x="150" y="42" font-family="'Fira Code', monospace" font-size="11" fill="#e0e7ff" text-anchor="middle">Appel avec Paramètres Effectifs (pe)</text>
  </g>

  <!-- Branch Arrows -->
  <path d="M 330 70 L 200 100" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arrow-down)"/>
  <path d="M 470 70 L 600 100" stroke="#6366f1" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arrow-down)"/>

  <!-- Left Module: La Fonction -->
  <g transform="translate(40, 105)">
    <rect x="0" y="0" width="340" height="135" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.5"/>
    <rect x="10" y="10" width="320" height="28" rx="6" fill="url(#grad-func)"/>
    <text x="170" y="29" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">1. LA FONCTION (def ... : return val)</text>

    <rect x="15" y="46" width="310" height="34" rx="4" fill="#0f172a" stroke="#047857"/>
    <text x="170" y="67" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">def perimetre(l, h): return 2 * (l + h)</text>

    <rect x="15" y="88" width="310" height="36" rx="4" fill="#064e3b" stroke="#10b981"/>
    <text x="170" y="104" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">🎯 Rôle : Calcule &amp; Retourne UN SEUL résultat</text>
    <text x="170" y="118" font-family="system-ui, sans-serif" font-size="10" fill="#6ee7b7" text-anchor="middle">Appel dans une affectation : p = perimetre(larg, long)</text>
  </g>

  <!-- Right Module: La Procédure -->
  <g transform="translate(420, 105)">
    <rect x="0" y="0" width="340" height="135" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="10" y="10" width="320" height="28" rx="6" fill="url(#grad-proc)"/>
    <text x="170" y="29" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">2. LA PROCÉDURE (def ... sans return)</text>

    <rect x="15" y="46" width="310" height="34" rx="4" fill="#0f172a" stroke="#b45309"/>
    <text x="170" y="67" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">def afficher_bilan(l, h, p, s, d): print(...)</text>

    <rect x="15" y="88" width="310" height="36" rx="4" fill="#78350f" stroke="#f59e0b"/>
    <text x="170" y="104" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fde68a" text-anchor="middle">⚡ Rôle : Action, Saisie ou Affichage (sans return)</text>
    <text x="170" y="118" font-family="system-ui, sans-serif" font-size="10" fill="#fcd34d" text-anchor="middle">Appel comme instruction autonome : afficher_bilan(...)</text>
  </g>
</svg>
