<svg viewBox="0 0 800 250" width="100%" height="230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#3b82f6" />
    </marker>
  </defs>

  <!-- Main Background Container -->
  <rect x="10" y="10" width="780" height="230" rx="12" fill="#1e293b" fill-opacity="0.05" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Title Badge -->
  <rect x="220" y="20" width="360" height="34" rx="8" fill="url(#grad-blue)"/>
  <text x="400" y="42" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Les 3 Traitements Élémentaires sur Tableau 1D</text>

  <!-- Pattern 1: Cumul (Somme & Moyenne) -->
  <g transform="translate(30, 75)">
    <rect x="0" y="0" width="230" height="145" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="10" y="10" width="210" height="28" rx="6" fill="url(#grad-blue)"/>
    <text x="115" y="29" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1. Accumulation (Somme)</text>

    <!-- Math Flow -->
    <rect x="15" y="48" width="200" height="32" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="115" y="69" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">somme ← 0.0</text>

    <path d="M 115 80 L 115 95" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <rect x="15" y="98" width="200" height="36" rx="4" fill="#0f172a" stroke="#3b82f6"/>
    <text x="115" y="115" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">somme ← somme + T[i]</text>
    <text x="115" y="128" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">moyenne ← somme / N</text>
  </g>

  <!-- Pattern 2: Extrémums (Max / Min) -->
  <g transform="translate(285, 75)">
    <rect x="0" y="0" width="230" height="145" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="10" y="10" width="210" height="28" rx="6" fill="url(#grad-amber)"/>
    <text x="115" y="29" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2. Extrémums (Max / Min)</text>

    <!-- Math Flow -->
    <rect x="15" y="48" width="200" height="32" rx="4" fill="#0f172a" stroke="#d97706"/>
    <text x="115" y="69" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">max_val ← T[0]</text>

    <path d="M 115 80 L 115 95" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <rect x="15" y="98" width="200" height="36" rx="4" fill="#0f172a" stroke="#f59e0b"/>
    <text x="115" y="114" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">Si (T[i] > max_val) Alors</text>
    <text x="115" y="128" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">  max_val ← T[i]</text>
  </g>

  <!-- Pattern 3: Comptage Conditionnel -->
  <g transform="translate(540, 75)">
    <rect x="0" y="0" width="230" height="145" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.5"/>
    <rect x="10" y="10" width="210" height="28" rx="6" fill="url(#grad-green)"/>
    <text x="115" y="29" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3. Comptage Conditionnel</text>

    <!-- Math Flow -->
    <rect x="15" y="48" width="200" height="32" rx="4" fill="#0f172a" stroke="#047857"/>
    <text x="115" y="69" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">nb_admis ← 0</text>

    <path d="M 115 80 L 115 95" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <rect x="15" y="98" width="200" height="36" rx="4" fill="#0f172a" stroke="#10b981"/>
    <text x="115" y="114" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">Si (Notes[i] ≥ 10.0) Alors</text>
    <text x="115" y="128" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">  nb_admis ← nb_admis + 1</text>
  </g>
</svg>
