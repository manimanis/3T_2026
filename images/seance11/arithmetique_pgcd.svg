<svg viewBox="0 0 800 250" width="100%" height="230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-pgcd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="grad-ppcm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>

    <marker id="arrow-purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#8b5cf6" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#06b6d4" />
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="10" y="10" width="780" height="230" rx="12" fill="#1e293b" fill-opacity="0.05" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Block 1: Algorithme d'Euclide (PGCD) -->
  <g transform="translate(30, 25)">
    <rect x="0" y="0" width="350" height="200" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="10" y="10" width="330" height="28" rx="6" fill="url(#grad-pgcd)"/>
    <text x="175" y="29" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">1. ALGORITHME D'EUCLIDE (PGCD)</text>

    <!-- Formula Box -->
    <rect x="20" y="50" width="310" height="45" rx="6" fill="#0f172a" stroke="#8b5cf6"/>
    <text x="175" y="77" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#c4b5fd" text-anchor="middle">PGCD(a, b) = PGCD(b, a % b)</text>

    <rect x="20" y="108" width="310" height="77" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="35" y="130" font-family="'Fira Code', monospace" font-size="11" fill="#f8fafc">while b != 0:</text>
    <text x="55" y="148" font-family="'Fira Code', monospace" font-size="11" fill="#a7f3d0">r = a % b; a = b; b = r</text>
    <text x="35" y="168" font-family="'Fira Code', monospace" font-size="11" fill="#f8fafc">return a  # PGCD trouvé !</text>
  </g>

  <!-- Block 2: PPCM & Applications -->
  <g transform="translate(420, 25)">
    <rect x="0" y="0" width="350" height="200" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="10" y="10" width="330" height="28" rx="6" fill="url(#grad-ppcm)"/>
    <text x="175" y="29" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">2. PPCM &amp; APPLICATIONS PRATIQUES</text>

    <!-- Formula Box -->
    <rect x="20" y="50" width="310" height="45" rx="6" fill="#0f172a" stroke="#06b6d4"/>
    <text x="175" y="77" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#67e8f9" text-anchor="middle">PPCM(a, b) = (a * b) // PGCD(a, b)</text>

    <!-- Application 1: Fraction -->
    <rect x="20" y="108" width="150" height="77" rx="6" fill="#0f172a" stroke="#06b6d4"/>
    <text x="95" y="130" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#67e8f9" text-anchor="middle">Fractions Irréductibles</text>
    <text x="95" y="152" font-family="'Fira Code', monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">num // g</text>
    <text x="95" y="168" font-family="'Fira Code', monospace" font-size="10" fill="#cbd5e1" text-anchor="middle">den // g</text>

    <!-- Application 2: Bus Sync -->
    <rect x="180" y="108" width="150" height="77" rx="6" fill="#0f172a" stroke="#06b6d4"/>
    <text x="255" y="130" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#67e8f9" text-anchor="middle">Sync Bus Scolaires</text>
    <text x="255" y="152" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1" text-anchor="middle">Intervalle = PPCM</text>
    <text x="255" y="168" font-family="system-ui, sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">Heure de croisement</text>
  </g>
</svg>
