<svg viewBox="0 0 920 360" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filtres et gradients -->
    <linearGradient id="grad-socle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="grad-accent-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Marqueurs de flèche -->
    <marker id="arr-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10b981" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Fond Principal -->
  <rect width="920" height="360" rx="14" fill="#0b1120" stroke="#334155" stroke-width="2"/>

  <!-- En-tête -->
  <rect x="16" y="12" width="888" height="42" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="32" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">
    DÉCOMPTE DE CHIFFRES PAR DIVISIONS SUCCESIVES ET CONTRÔLE DE SAISIE
  </text>
  <rect x="710" y="19" width="182" height="28" rx="6" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1"/>
  <text x="801" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">
    Activité 1 &amp; 2 · Palier Socle
  </text>

  <!-- =========================================================================
       PANNEAU GAUCHE : PROCESSUS DE DÉCOMPTE (x div 10)
       ========================================================================= -->
  <g id="decompte-chiffres">
    <rect x="16" y="64" width="480" height="282" rx="10" fill="url(#grad-socle)" stroke="#475569" stroke-width="1.2"/>
    
    <rect x="26" y="74" width="460" height="26" rx="6" fill="#334155"/>
    <text x="256" y="91" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">
      1. Mécanisme des Divisions par 10 (Exemple : x = 5403)
    </text>

    <!-- Étape 0 : Initialisation -->
    <rect x="34" y="112" width="105" height="46" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="86" y="130" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">x = 5403</text>
    <text x="86" y="147" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">nb_chiffres = 0</text>

    <!-- Flèche 1 -->
    <line x1="139" y1="135" x2="162" y2="135" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-cyan)"/>

    <!-- Étape 1 -->
    <rect x="165" y="112" width="95" height="46" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="212" y="130" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">5403 div 10</text>
    <text x="212" y="147" font-family="'Fira Code', monospace" font-size="10" fill="#a7f3d0" text-anchor="middle">x=540 | nb=1</text>

    <!-- Flèche 2 -->
    <line x1="260" y1="135" x2="283" y2="135" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-cyan)"/>

    <!-- Étape 2 -->
    <rect x="286" y="112" width="95" height="46" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="333" y="130" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">540 div 10</text>
    <text x="333" y="147" font-family="'Fira Code', monospace" font-size="10" fill="#a7f3d0" text-anchor="middle">x=54 | nb=2</text>

    <!-- Flèche 3 -->
    <line x1="381" y1="135" x2="404" y2="135" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-cyan)"/>

    <!-- Étape 3 -->
    <rect x="407" y="112" width="75" height="46" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="444" y="130" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">54 div 10</text>
    <text x="444" y="147" font-family="'Fira Code', monospace" font-size="10" fill="#a7f3d0" text-anchor="middle">x=5 | nb=3</text>

    <!-- Ligne de descente vers l'étape finale -->
    <path d="M 444 158 L 444 190 L 34 190 L 34 220" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4 2" marker-end="url(#arr-cyan)"/>

    <!-- Étape 4 (Finale) -->
    <rect x="34" y="222" width="135" height="52" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="101" y="242" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#fde68a" text-anchor="middle">5 div 10 = 0</text>
    <text x="101" y="260" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">x = 0 | nb = 4</text>

    <!-- Flèche vers arrêt -->
    <line x1="169" y1="248" x2="205" y2="248" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-green)"/>

    <!-- Résultat final validé -->
    <rect x="210" y="222" width="272" height="52" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1.8"/>
    <text x="346" y="243" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#86efac" text-anchor="middle">
      CONDITION D'ARRÊT : x == 0 (Faux)
    </text>
    <text x="346" y="262" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
      Sortie de boucle : Résultat = 4 chiffres
    </text>

    <!-- Note de synthèse bas gauche -->
    <rect x="34" y="290" width="448" height="42" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="46" y="307" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">
      <tspan font-weight="700" fill="#38bdf8">Règle algorithmique :</tspan> Tant que (x &gt; 0) Faire x ← x div 10 ; nb ← nb + 1
    </text>
    <text x="46" y="323" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">
      Fonctionne pour tout entier naturel sans recourir aux chaînes de caractères.
    </text>
  </g>

  <!-- =========================================================================
       PANNEAU DROIT : CONTRÔLE DE SAISIE DU CODE (code > 0)
       ========================================================================= -->
  <g id="controle-saisie">
    <rect x="508" y="64" width="396" height="282" rx="10" fill="url(#grad-socle)" stroke="#475569" stroke-width="1.2"/>
    
    <rect x="518" y="74" width="376" height="26" rx="6" fill="#334155"/>
    <text x="706" y="91" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">
      2. Contrôle de Saisie du Code (code &gt; 0)
    </text>

    <!-- Saisie initiale -->
    <rect x="626" y="112" width="160" height="34" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="706" y="133" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">
      code = int(input())
    </text>

    <!-- Flèche descente vers losange -->
    <line x1="706" y1="146" x2="706" y2="170" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-cyan)"/>

    <!-- Condition Losange -->
    <polygon points="706,170 820,205 706,240 592,205" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="706" y="201" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#fde68a" text-anchor="middle">
      Condition d'erreur :
    </text>
    <text x="706" y="217" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">
      code ≤ 0 ?
    </text>

    <!-- Branche VRAI (Valeur erronée -> Boucler) -->
    <line x1="820" y1="205" x2="880" y2="205" stroke="#ef4444" stroke-width="2"/>
    <line x1="880" y1="205" x2="880" y2="129" stroke="#ef4444" stroke-width="2"/>
    <line x1="880" y1="129" x2="786" y2="129" stroke="#ef4444" stroke-width="2" marker-end="url(#arr-red)"/>
    <rect x="826" y="190" width="46" height="18" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
    <text x="849" y="203" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#fca5a5" text-anchor="middle">VRAI</text>
    <text x="850" y="160" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#f87171" transform="rotate(-90 850,160)" text-anchor="middle">Re-saisir</text>

    <!-- Branche FAUX (Valeur valide -> Sortir) -->
    <line x1="706" y1="240" x2="706" y2="280" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-green)"/>
    <rect x="714" y="248" width="46" height="18" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="737" y="261" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#86efac" text-anchor="middle">FAUX</text>

    <!-- Sortie validée -->
    <rect x="586" y="280" width="240" height="42" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-width="1.8"/>
    <text x="706" y="298" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">
      ✓ CODE VALIDE (code &gt; 0)
    </text>
    <text x="706" y="313" font-family="system-ui, sans-serif" font-size="9.5" fill="#ffffff" text-anchor="middle">
      Transmission au module de décompte
    </text>
  </g>
</svg>
