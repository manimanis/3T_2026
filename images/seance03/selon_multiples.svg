<svg viewBox="0 0 680 240" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- Selector Box Top Centered -->
  <rect x="250" y="15" width="180" height="50" rx="10" fill="#2563eb" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="340" y="45" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Selon Sélecteur</text>

  <!-- Branch Lines -->
  <!-- Branch 1 (Far Left) -->
  <line x1="280" y1="65" x2="90" y2="120" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="170" y="85" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#059669">valeur1</text>

  <!-- Branch 2 (Mid Left) -->
  <line x1="320" y1="65" x2="250" y2="120" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="260" y="98" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#059669">valeur2 | v3</text>

  <!-- Branch 3 (Mid Right) -->
  <line x1="360" y1="65" x2="430" y2="120" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="415" y="98" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#059669">v4 .. v5</text>

  <!-- Branch 4 Default (Far Right) -->
  <line x1="400" y1="65" x2="590" y2="120" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="515" y="85" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#dc2626">Sinon / case _</text>

  <!-- Execution Boxes -->
  <!-- Box 1 -->
  <rect x="25" y="125" width="130" height="48" rx="8" fill="#059669" stroke="#047857" stroke-width="2"/>
  <text x="90" y="154" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Traitement 1</text>

  <!-- Box 2 -->
  <rect x="185" y="125" width="130" height="48" rx="8" fill="#059669" stroke="#047857" stroke-width="2"/>
  <text x="250" y="154" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Traitement 2</text>

  <!-- Box 3 -->
  <rect x="365" y="125" width="130" height="48" rx="8" fill="#059669" stroke="#047857" stroke-width="2"/>
  <text x="430" y="154" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Traitement 3</text>

  <!-- Box Default -->
  <rect x="525" y="125" width="130" height="48" rx="8" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
  <text x="590" y="154" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Par Défaut</text>

  <!-- Rejoin Line -->
  <line x1="90" y1="173" x2="90" y2="215" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="250" y1="173" x2="250" y2="215" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="430" y1="173" x2="430" y2="215" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="590" y1="173" x2="590" y2="215" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="90" y1="215" x2="590" y2="215" stroke="#2563eb" stroke-width="2.5"/>
</svg>
