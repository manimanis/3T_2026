<svg viewBox="0 0 800 250" width="100%" height="230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-lib" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="grad-array" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <marker id="arrow-sky" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 5 L 0 8.5 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Outer Card -->
  <rect x="10" y="10" width="780" height="230" rx="12" fill="#1e293b" fill-opacity="0.05" stroke="#0284c7" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Left Block: Predefined Modules -->
  <g transform="translate(30, 25)">
    <rect x="0" y="0" width="350" height="200" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="10" y="10" width="330" height="28" rx="6" fill="url(#grad-lib)"/>
    <text x="175" y="29" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">MODULES PRÉDÉFINIS (math, random, str)</text>

    <!-- Sub-boxes -->
    <rect x="20" y="50" width="150" height="60" rx="6" fill="#0f172a" stroke="#0284c7"/>
    <text x="95" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">random.randint(a, b)</text>
    <text x="95" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Entier aléatoire ∈ [a, b]</text>

    <rect x="180" y="50" width="150" height="60" rx="6" fill="#0f172a" stroke="#0284c7"/>
    <text x="255" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">math.sqrt(x)</text>
    <text x="255" y="90" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Racine carrée de x</text>

    <rect x="20" y="125" width="310" height="60" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="175" y="145" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">len(ch), ch.upper(), str(x)</text>
    <text x="175" y="165" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Manipulation &amp; conversions sur les chaînes</text>
  </g>

  <!-- Right Block: Passage de Tableaux numpy -->
  <g transform="translate(420, 25)">
    <rect x="0" y="0" width="350" height="200" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.5"/>
    <rect x="10" y="10" width="330" height="28" rx="6" fill="url(#grad-array)"/>
    <text x="175" y="29" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">TABLEAUX 1D EN PARAMÈTRES (@T)</text>

    <!-- Flow Diagram -->
    <rect x="20" y="50" width="140" height="60" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="90" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">Prog. Principal</text>
    <text x="90" y="90" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">T_notes = array(...)</text>

    <path d="M 165 80 L 195 80" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)"/>

    <rect x="200" y="50" width="130" height="60" rx="6" fill="#0f172a" stroke="#10b981"/>
    <text x="265" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#a7f3d0" text-anchor="middle">Module (@T)</text>
    <text x="265" y="90" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">T[i] = randint(...)</text>

    <rect x="20" y="125" width="310" height="60" rx="6" fill="#064e3b" stroke="#10b981"/>
    <text x="175" y="145" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">Passage par Adresse Automatique</text>
    <text x="175" y="165" font-family="system-ui, sans-serif" font-size="10" fill="#a7f3d0" text-anchor="middle">Modifie directement le tableau d'origine sans copie</text>
  </g>
</svg>
